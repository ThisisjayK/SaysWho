<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="wrap">

  <header>
    <span class="mark" aria-hidden="true"></span>
    <span class="name">SaysWho</span>
    <span class="version" id="version"></span>
  </header>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span class="state" id="server-state">Checking</span>
  </div>

  <div class="cmd" id="cmd-wrap" hidden>
    <div class="cmd-head">
      <span class="cmd-label">Run this</span>
      <button type="button" class="link" id="copy">Copy</button>
    </div>
    <pre class="cmd-body"><code id="cmd"></code></pre>
  </div>

  <div class="actions">
    <button type="button" id="capture" class="primary">Capture</button>
    <button type="button" id="audit">Audit</button>
  </div>

  <p class="note" id="action-note"></p>

  <section class="history" id="last" hidden>
    <span class="history-label">Last capture</span>
    <p class="history-line"><span id="last-when"></span><span id="last-detail"></span></p>
    <p class="warn" id="last-warning" hidden></p>
  </section>

  <label class="toggle">
    <input type="checkbox" id="show-dock" checked>
    <span>Buttons on the page</span>
  </label>

</div>
<script src="adapters.js"></script>
<script src="popup.js"></script>
</body>
</html>
